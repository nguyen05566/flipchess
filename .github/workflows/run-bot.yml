name: Run Bot

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (minutes, max 360)'
        required: false
        default: '360'
  schedule:
    # Chạy mỗi giờ (bot sẽ tự chơi đến khi timeout)
    - cron: '0 * * * *'

# =========================================================================
# Cấu hình Concurrency chống chạy chồng lấn
# - group: Gom tất cả các lượt run của workflow này (hoặc cùng branch) vào 1 nhóm.
# - cancel-in-progress: true -> Khi có lượt run mới, lượt run cũ đang chạy sẽ bị HỦY NGAY.
# (Nếu bạn muốn lượt run mới phải XẾP HÀNG CHỜ lượt run cũ kết thúc thì đổi thành `cancel-in-progress: false`)
# =========================================================================
concurrency:
  group: bot-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install websocket-client

      - name: Download mainline Pikafish binary
        run: |
          echo "=== Downloading mainline Pikafish (mistboard level 8 engine) ==="
          # Mainline Pikafish release (official-pikafish/Pikafish).
          # mistboard's pikafish-xiangqi-level-8 tier drives this binary via UCI:
          #   nodes=3_000_000, movetimeMs=4_000, EvalFile=pikafish.nnue
          curl -sL -o pikafish.tar.gz \
            https://github.com/official-pikafish/Pikafish/releases/download/v2025.1/pikafish-x86-64.tar.gz \
            || curl -sL -o pikafish.tar.gz \
            https://github.com/official-pikafish/Pikafish/releases/latest/download/pikafish-x86-64.tar.gz
          mkdir -p pikafish-extract
          tar -xzf pikafish.tar.gz -C pikafish-extract || true
          # Tìm binary pikafish trong cây giải nén và copy vào workspace root
          BIN_PATH=$(find pikafish-extract -name 'pikafish*' -type f -executable | head -1)
          if [ -z "$BIN_PATH" ]; then
            # Fallback: một số release để binary sẵn trong root, không trong subdir
            BIN_PATH=$(find pikafish-extract -name 'pikafish*' -type f | head -1)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "❌ Không tìm thấy binary pikafish trong archive"
            ls -laR pikafish-extract | head -50
            exit 1
          fi
          cp "$BIN_PATH" ./pikafish
          chmod +x ./pikafish
          ls -la ./pikafish
          echo "=== Smoke test ==="
          printf 'uci\nquit\n' | ./pikafish | head -5

      - name: Download pikafish.nnue
        run: |
          echo "=== Downloading pikafish.nnue (REQUIRED by mainline Pikafish) ==="
          # Mainline Pikafish REFUSES to evaluate without an EvalFile loaded.
          # The official net is published at official-pikafish/Networks.
          curl -sL -o pikafish.nnue \
            https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue
          ls -la pikafish.nnue
          file pikafish.nnue | head -1

      - name: Verify files
        run: |
          echo "=== Files in workspace ==="
          ls -la cup_bot_flipchess.py ws_frame_dump.py pikafish pikafish.nnue
          echo "=== Python syntax check ==="
          python3 -m py_compile cup_bot_flipchess.py && echo "OK"

      - name: Run bot
        env:
          CARO_USER19: ${{ secrets.CARO_USER19 }}
          CARO_PASSWD19: ${{ secrets.CARO_PASSWD19 }}
          # Optional engine path overrides (mistboard convention)
          MISTBOARD_PIKAFISH_XIANGQI_PATH: ${{ github.workspace }}/pikafish
          MISTBOARD_PIKAFISH_XIANGQI_NET: ${{ github.workspace }}/pikafish.nnue
        run: |
          echo "=== Starting bot at $(date) ==="
          echo "=== Engine: mainline Pikafish (mistboard pikafish-xiangqi-level-8) ==="
          echo "=== Logic: chỉ tạo bàn 5000 xu (CREATE_RULE), KHÔNG dò/find bàn ==="
          python3 -u cup_bot_flipchess.py 2>&1 | grep -v "WS-CAPTURE\|hidden piece"
          echo "=== Bot stopped at $(date) ==="

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            ws_capture/
          retention-days: 7
